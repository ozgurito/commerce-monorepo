# ==============================
# Server
# ==============================
server.port=8080
spring.application.name=monorepo

# ==============================
# Database
# ==============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/commerce}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.json_format_mapper=jsonb
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# ==============================
# Security (dev basic auth)
# ==============================
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}
spring.security.user.roles=ADMIN

# ==============================
# Actuator
# ==============================
management.endpoints.web.exposure.include=health,info

# ==============================
# Swagger / SpringDoc
# ==============================
# Prod'da SWAGGER_ENABLED=false ENV değişkeni ile kapat
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.commerce.monorepo
springdoc.paths-to-match=/api/**
springdoc.default-flat-param-object=true

# ==============================
# iyzico
# ==============================
iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
iyzico.api-key=${IYZICO_API_KEY:changeme}
iyzico.secret-key=${IYZICO_SECRET_KEY:changeme}
iyzico.callback-url=${IYZICO_CALLBACK_URL:http://localhost:8080/api/payments/iyzico/callback}
iyzico.locale=${IYZICO_LOCALE:tr}

# ==============================
# Logging
# ==============================
logging.level.com.commerce.monorepo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
server.error.include-message=always
server.error.include-binding-errors=always
# Geliştirmede detaylı log için aşağıdaki satırları aktif et:
# logging.level.com.commerce.monorepo=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.springframework.security=DEBUG

# ==============================
# S3 / MinIO
# ==============================
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.accessKey=${S3_ACCESS_KEY:minio}
storage.s3.secretKey=${S3_SECRET_KEY:minio123}
storage.s3.bucket=${S3_BUCKET:commerce-assets}
storage.s3.pathStyle=true

# ==============================
# JWT
# ==============================
# UYARI: Prod'da JWT_SECRET ve REFRESH_PEPPER mutlaka ENV ile override edilmeli!
jwt.secret=${JWT_SECRET:DEV_ONLY_CHANGE_THIS_IN_PROD_MIN32CHARS!!!}
jwt.expiration=${JWT_EXPIRATION:3600000}
refresh.pepper=${REFRESH_PEPPER:DEV_ONLY_CHANGE_THIS_PEPPER_IN_PROD!!!}
refresh.expiration=${REFRESH_EXPIRATION:14}

# ==============================
# Email / SMTP
# ==============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App email settings
app.email.from=${APP_EMAIL_FROM:noreply@yourstore.com}
app.email.from-name=${APP_EMAIL_FROM_NAME:Your Store}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ==============================
# App Settings
# ==============================
app.admin.email=${ADMIN_EMAIL:admin@yourstore.com}
# Prod'da nginx/LB arkasındaysa true yap — X-Forwarded-For'u güvenli okur
app.trusted-proxy-enabled=${TRUSTED_PROXY:false}

# ==============================
# HikariCP Connection Pool
# ==============================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=CommerceHikariPool

# ==============================
# JDBC Batch (Toplu insert performansı)
# ==============================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ==============================
# Banka Havale Bilgileri
# ==============================
app.bank.iban=${BANK_IBAN:TR000000000000000000000000}
app.bank.account-holder=${BANK_ACCOUNT_HOLDER:Your Store Ltd.}
app.bank.name=${BANK_NAME:Türkiye İş Bankası}
app.bank.transfer-deadline-hours=${BANK_TRANSFER_DEADLINE_HOURS:48}

# ==============================
# Dosya Upload (Excel import)
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB