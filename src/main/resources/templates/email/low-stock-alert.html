<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Düşük Stok Uyarısı</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" style="width: 600px; border-collapse: collapse; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <tr>
                        <td style="padding: 40px 40px 20px; text-align: center; background-color: #F59E0B; border-radius: 8px 8px 0 0;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 24px;">⚠️ Düşük Stok Uyarısı</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px;">
                            <p style="margin: 0 0 20px; color: #333333; font-size: 16px;">
                                Aşağıdaki ürünün stok seviyesi belirlenen eşiğin altına düştü:
                            </p>
                            <div style="background-color: #FFFBEB; padding: 20px; border-radius: 6px; border-left: 4px solid #F59E0B; margin-bottom: 20px;">
                                <strong style="color: #92400E; font-size: 16px;" th:text="${productName}">Ürün Adı</strong>
                                <div style="margin-top: 10px;">
                                    <span style="color: #B45309;">Mevcut Stok: </span>
                                    <strong style="color: #DC2626;" th:text="${currentStock}">5</strong>
                                    <span style="color: #B45309;"> / Eşik: </span>
                                    <span th:text="${threshold}">10</span>
                                </div>
                            </div>
                            <table role="presentation" style="width: 100%;">
                                <tr>
                                    <td align="center" style="padding: 20px 0;">
                                        <a th:href="${adminUrl}" style="display: inline-block; padding: 14px 32px; background-color: #F59E0B; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 600;">
                                            Stok Yönetimi
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
